services:
  sglang-v100:
    build:
      context: ..
      dockerfile: docker/v100.Dockerfile
      network: host
      args:
        MAX_JOBS: ${MAX_JOBS:-}
    image: sglang-v100:latest
    container_name: sglang-v100
    network_mode: host
    ipc: host
    restart: "no"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      NCCL_P2P_LEVEL: NVL
      SGLANG_CUSTOM_ALLREDUCE_ALGO: 1stage
      SGLANG_MAMBA_CONV_DTYPE: float16
      SGLANG_MAMBA_SSM_DTYPE: float16
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - sglang-v100-flashinfer:/root/.cache/flashinfer
      - sglang-v100-tilelang:/root/.tilelang
      - sglang-v100-triton:/root/.triton
      - sglang-v100-inductor:/tmp/torchinductor_root
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --model
      - Qwen/Qwen3.5-122B-A10B-GPTQ-Int4
      - --dtype
      - float16
      - --quantization
      - gptq_marlin
      - --attention-backend
      - flash_attn_v100
      - --tensor-parallel-size
      - "4"
      - --host
      - 0.0.0.0
      - --port
      - "8082"
      - --mem-fraction-static
      - "0.78"
      - --context-length
      - "262144"
      - --max-running-requests
      - "4"
      - --chunked-prefill-size
      - "16384"
      - --enable-nccl-nvls

volumes:
  sglang-v100-flashinfer:
  sglang-v100-tilelang:
  sglang-v100-triton:
  sglang-v100-inductor:
